[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modaic"
version = "0.48.0"
description = "Official Python client for the Modaic API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Modaic", email = "support@modaic.dev" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "tqdm>=4.66,<5",
]

[project.urls]
Documentation = "https://docs.modaic.dev"
Repository = "https://github.com/modaic-ai/modaic"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "types-tqdm>=4.66,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modaic"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/LICENSE", "/uv.lock"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["modaic"]
