name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --locked
      - run: uv run ruff format --check src/modaic tests
      - run: uv run ruff check src/modaic tests
      - run: uv run mypy src/modaic
      - run: uv run pytest
      - run: uv build
