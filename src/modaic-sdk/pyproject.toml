[project]
name = "modaic"
dynamic = ["version"]
description = "Modaic, a python framework for packaging and reproducing DSPy programs"
authors = [{ name = "Tyrin", email = "tyrin@modaic.dev" }, {name = "Farouk", email = "farouk@modaic.dev"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "modaic-client",
    # >=3.3.0: BaseLM.copy() is a shallow copy (message capture in Predict.__call__
    # copies the LM per call; on <=3.2.1 that was a deepcopy costing up to ~445ms at
    # the default max_history_size). <4: the typed LMRequest/LMResponse forward path
    # becomes the default in the 3.5+/4.0 window and changes the history entry shape
    # that message capture reads.
    "dspy>=3.3.0,<4",
    "litellm>=1.80.8",
    "gitpython>=3.1.45",
    "filelock>=3.18.0",
    "safetensors>=0.7.0",
    "tomlkit>=0.13.3",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
batch = [
    "anthropic>=0.40.0",
    "cloudpickle>=3.0.0",
    "duckdb>=1.2.0",
    "httpx>=0.27.0",
    "lmdb>=1.4.0",
    "openai>=1.0.0",
    "pandas",
    "modal",
    "together>=2.0.0a17",
    "datasets",
    "vllm>=0.18.0",
    "huggingface-hub",
    "hf_transfer",
    "hf-xet>=1.1.7",
]

anthropic = [
    "anthropic>=0.40.0",
    "duckdb>=1.2.0",
    "httpx>=0.27.0",
]

openai = [
    "duckdb>=1.2.0",
    "openai>=1.0.0",
]

azure = [
    "duckdb>=1.2.0",
    "openai>=1.0.0",
]

together = [
    "duckdb>=1.2.0",
    "together>=2.0.0a17",
]

fireworks = [
    "duckdb>=1.2.0",
    "httpx>=0.27.0",
]

modal = [
    "duckdb>=1.2.0",
    "pandas",
    "modal",
]

vllm = [
    "duckdb>=1.2.0",
    "pandas",
    "datasets",
    "vllm>=0.18.0",
    "huggingface-hub",
    "hf_transfer",
    "hf-xet>=1.1.7",
]


[project.urls]
Homepage = "https://github.com/modaic-ai/modaic"
Modaic = "https://www.modaic.dev"
Docs = "https://docs.modaic.dev"

[tool.uv.sources]
modaic-client = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.sdist]
include = ["modaic"]

[tool.hatch.build.targets.wheel]
packages = ["modaic"]
